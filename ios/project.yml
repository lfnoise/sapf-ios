# Generates Sapf.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen
#   cd ios && xcodegen
# The generated project is checked in, so this is only needed after changing this file
# or adding/removing source files.

name: Sapf
options:
  bundleIdPrefix: com.audiosynth
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.22"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9KC49MZKRM

targets:
  Sapf:
    type: application
    platform: iOS
    sources:
      - path: Sapf
      - path: ../src
        excludes:
          - main.cpp
      - path: ../include
        buildPhase: none
      - path: ../sapf-prelude.txt
        buildPhase: resources
      - path: ../sapf-examples.txt
        buildPhase: resources
      - path: ../sapf-bif-examples.txt
        buildPhase: resources
      - path: ../README.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiosynth.sapf
        PRODUCT_NAME: Sapf
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sapf/Engine/Sapf-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../include
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # The shared interpreter sources are written for the desktop warning set; don't drown the app's warnings.
        WARNING_CFLAGS: -Wno-shorten-64-to-32 -Wno-comma -Wno-unused-variable -Wno-deprecated-declarations
    info:
      path: Sapf/Info.plist
      properties:
        CFBundleDisplayName: sapf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SapfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SapfUITests
    dependencies:
      - target: Sapf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiosynth.sapf.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sapf

  SapfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SapfTests
    dependencies:
      - target: Sapf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiosynth.sapf.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sapf.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sapf
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Sapf:
    build:
      targets:
        Sapf: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SapfTests
        - SapfUITests
